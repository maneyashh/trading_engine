name: Apex Supervisor Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours automatically

jobs:
  train-on-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wake Up Kaggle Supercomputer
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Connecting to Kaggle API..."
          pip install kaggle
          
          # Push code and secrets metadata to Kaggle
          kaggle kernels push -p ./kaggle_config
          
          echo "Heartbeat successfully sent. Kaggle is now training the AI with Sentiment Analysis."