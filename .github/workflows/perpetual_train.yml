name: Apex Supervisor Heartbeat

on:
  schedule:
    # This acts as an alarm clock, waking up Kaggle every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to trigger a run manually with a button click

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wake Up Kaggle Supercomputer
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Connecting to Kaggle API..."
          pip install kaggle
          
          # This command will beam your code to Kaggle's GPU servers
          kaggle kernels push -p ./kaggle_config
          
          echo "Heartbeat successfully sent. Kaggle is now training the AI."